name: Android APK

# APK приложения сотрудника — окно (WebView) к сайту на GitHub Pages.
# Пересобирать нужно только при изменении папки android/: обновления самого приложения
# приходят с сайта автоматически.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Ключ подписи хранится в секретах репозитория. Без постоянного ключа
      # новая версия APK не встанет поверх установленной.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SMU_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Не задан секрет SMU_KEYSTORE_BASE64 (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/smu-release.p12"

      - name: Build APK
        working-directory: android
        env:
          SMU_KEYSTORE_PATH: ${{ runner.temp }}/smu-release.p12
          SMU_KEYSTORE_PASSWORD: ${{ secrets.SMU_KEYSTORE_PASSWORD }}
          SMU_KEY_PASSWORD: ${{ secrets.SMU_KEYSTORE_PASSWORD }}
          SMU_KEY_ALIAS: smu
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/SMUm.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SMUm-apk
          path: ${{ runner.temp }}/SMUm.apk

      # Постоянная ссылка на свежий APK: …/releases/download/android-latest/SMUm.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest "$RUNNER_TEMP/SMUm.apk" \
            --target "${{ github.sha }}" \
            --title "СМУм для Android" \
            --notes "Установочный файл приложения сотрудника. Приложение открывает сайт СМУм и обновляется само — переустанавливать APK не нужно."
