<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle with Shadow -->
  <circle cx="256" cy="256" r="240" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Medical Cross Symbol -->
  <g transform="translate(256, 180)">
    <rect x="-30" y="-60" width="60" height="120" rx="6" fill="#1e40af"/>
    <rect x="-60" y="-30" width="120" height="60" rx="6" fill="#1e40af"/>
  </g>
  
  <!-- Text "Алко" in Blue -->
  <text x="256" y="340" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#1e40af" text-anchor="middle">
    Алко
  </text>
  
  <!-- Text "Спас" in Red -->
  <text x="256" y="410" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#dc2626" text-anchor="middle">
    Спас
  </text>
</svg>
