<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- White Inner Circle -->
  <circle cx="256" cy="256" r="200" fill="#ffffff"/>
  
  <!-- Medical Cross -->
  <rect x="226" y="156" width="60" height="200" rx="8" fill="#dc2626"/>
  <rect x="156" y="226" width="200" height="60" rx="8" fill="#dc2626"/>
  
  <!-- Stethoscope Symbol (simplified) -->
  <path d="M 320 180 Q 340 180 340 200 L 340 240 Q 340 260 320 260" 
        stroke="#1e40af" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="320" cy="270" r="15" fill="#1e40af"/>
  <circle cx="320" cy="270" r="8" fill="#ffffff"/>
  
  <!-- Heartbeat Line -->
  <path d="M 140 340 L 180 340 L 190 320 L 200 360 L 210 330 L 220 350 L 230 340 L 380 340" 
        stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
