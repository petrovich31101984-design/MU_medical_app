<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>СМУ</title>
  <defs>
    <!-- Закатное небо -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B0638"/>
      <stop offset="0.45" stop-color="#7A1A78"/>
      <stop offset="0.75" stop-color="#E8436F"/>
      <stop offset="1" stop-color="#FF9A4D"/>
    </linearGradient>
    <!-- Солнце -->
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE873"/>
      <stop offset="0.6" stop-color="#FF8A4C"/>
      <stop offset="1" stop-color="#FF3C8E"/>
    </linearGradient>
    <!-- Неоновое кольцо -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CFFC8"/>
      <stop offset="0.5" stop-color="#14C98A"/>
      <stop offset="1" stop-color="#0B8F6A"/>
    </linearGradient>
    <!-- Крест -->
    <linearGradient id="cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4F6E"/>
      <stop offset="1" stop-color="#C3122F"/>
    </linearGradient>
    <!-- Буквы: от синего к розовому -->
    <linearGradient id="letters" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FD8FF"/>
      <stop offset="0.5" stop-color="#3D6BFF"/>
      <stop offset="1" stop-color="#C64BFF"/>
    </linearGradient>
    <clipPath id="inner"><circle cx="256" cy="256" r="214"/></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Белый фон внутри кольца -->
  <circle cx="256" cy="256" r="200" fill="#FFFFFF"/>

  <!-- Неоновое кольцо -->
  <circle cx="256" cy="256" r="227" fill="none" stroke="#0A2A22" stroke-width="58"/>
  <circle cx="256" cy="256" r="227" fill="none" stroke="url(#ring)" stroke-width="46" filter="url(#glow)"/>

  <!-- Надпись по кольцу -->
  <!-- Дуга почти по всей окружности, внизу зазор под номер версии -->
  <path id="arcTop" d="M 125.8 441.9 A 227 227 0 1 1 386.2 441.9" fill="none"/>
  <text font-family="'Arial Black', 'Segoe UI Black', Arial, sans-serif" font-weight="900"
        font-size="32" fill="#FFFFFF" stroke="#0A2A22" stroke-width="3"
        paint-order="stroke" dominant-baseline="central">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle" textLength="1100" lengthAdjust="spacing">СИСТЕМА МЕДИЦИНСКОГО УЧЁТА</textPath>
  </text>
  <!-- Версия по нижней дуге -->
  <path id="arcBottom" d="M 29 256 A 227 227 0 0 0 483 256" fill="none"/>
  <text font-family="'Arial Black', 'Segoe UI Black', Arial, sans-serif" font-weight="900"
        font-size="24" letter-spacing="1.5" fill="#FFFFFF" stroke="#0A2A22" stroke-width="3"
        paint-order="stroke" dominant-baseline="central">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">0.5.5</textPath>
  </text>

  <!-- Крест с тёмной обводкой -->
  <path d="M204 70 H308 A18 18 0 0 1 326 88 V186 H424 A18 18 0 0 1 442 204 V308 A18 18 0 0 1 424 326 H326 V424 A18 18 0 0 1 308 442 H204 A18 18 0 0 1 186 424 V326 H88 A18 18 0 0 1 70 308 V204 A18 18 0 0 1 88 186 H186 V88 A18 18 0 0 1 204 70 Z"
        fill="url(#cross)" stroke="#1B0638" stroke-width="8" stroke-linejoin="round"/>

  <!-- Буквы СМУ: наклон, тень, толстая обводка -->
  <g transform="translate(256 256)"
     font-family="'Arial Black', 'Segoe UI Black', Impact, Arial, sans-serif"
     font-weight="900" font-size="132" text-anchor="middle">
    <text x="9" y="9" dy="0.35em" fill="#1B0638" stroke="#1B0638" stroke-width="18" stroke-linejoin="round">СМУ</text>
    <text x="0" y="0" dy="0.35em" fill="#1B0638" stroke="#1B0638" stroke-width="18" stroke-linejoin="round">СМУ</text>
    <text x="0" y="0" dy="0.35em" fill="url(#letters)" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round" paint-order="stroke">СМУ</text>
  </g>
</svg>
